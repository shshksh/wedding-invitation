<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>민준 ♥ 서연, 결혼합니다</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1b2433;--mute:#6b7488;--acc:#5d74b8;--soft:#e6eaf3;--line:#dfe3ee;--blush:#f2c4bd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--card:#171d2e;--ink:#eceff7;--mute:#97a0b8;--acc:#9db0ee;--soft:#1a2135;--line:#272f47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1320;--card:#171d2e;--ink:#eceff7;--mute:#97a0b8;--acc:#9db0ee;--soft:#1a2135;--line:#272f47;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--soft);color:var(--ink);font:400 15px/1.95 'Gowun Batang','Noto Serif KR',serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 50px #0002}
.en{font:italic 400 17px/1 'Cormorant Garamond',serif;letter-spacing:.12em;color:var(--acc);margin:0}
section{padding:84px 28px;text-align:center}
h2{font-size:21px;font-weight:700;margin:0 0 34px;letter-spacing:.1em}
h2::after{content:"";display:block;width:1px;height:28px;background:var(--acc);margin:16px auto 0}
p{margin:0}
.rv{opacity:0;transform:translateY(14px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
/* cover */
.cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;transition:visibility 0s 1.5s}
.cv{position:absolute;top:0;bottom:0;width:50.5%;background:var(--soft);transition:transform 1.3s cubic-bezier(.77,0,.18,1)}
.cv.l{left:0;border-right:1px solid var(--line)}.cv.r{right:0}
.seal{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;transition:transform .8s,opacity .6s}
.seal span{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#9fb1e0,var(--acc));color:#fff;font:italic 500 30px 'Cormorant Garamond',serif;box-shadow:0 10px 30px -8px var(--acc);animation:pu 2s infinite}
.seal small{font-size:13px;color:var(--mute);letter-spacing:.2em}
@keyframes pu{0%{box-shadow:0 0 0 0 #5d74b866}100%{box-shadow:0 0 0 30px #5d74b800}}
.cover.open .cv.l{transform:translateX(-101%)}.cover.open .cv.r{transform:translateX(101%)}
.cover.open .seal{transform:scale(2.4);opacity:0}.cover.open{visibility:hidden;pointer-events:none}
/* hero */
.hero{min-height:100svh;padding:56px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.arch{width:236px;height:310px;border-radius:118px 118px 6px 6px;overflow:hidden;margin:24px 0 30px;position:relative;box-shadow:0 24px 50px -22px var(--acc)}
.arch b{position:absolute;inset:-12% 0;background:linear-gradient(180deg,#8ea3dc 0%,#c9bfe0 52%,#f6c9bf 100%);transform:translateY(var(--py,0px))}
.arch::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 115%,#fff9 0,#fff0 65%);animation:gl 4s ease-in-out infinite alternate}
@keyframes gl{to{opacity:.25}}
.arch svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.arch circle{fill:none;stroke:#fff;stroke-width:1.3;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.4s ease .9s}
.arch.in circle{stroke-dashoffset:0}.arch circle+circle{transition-delay:1.5s}
h1{font-size:34px;font-weight:700;letter-spacing:.14em;margin:0}
h1 i{font:italic 500 30px 'Cormorant Garamond',serif;color:var(--acc);margin:0 .45em}
.hero .d{margin-top:16px;line-height:1.9;color:var(--mute)}
.sc{margin-top:34px;width:1px;height:44px;background:linear-gradient(var(--acc),transparent);animation:sc 1.8s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.gr p+p{margin-top:0}.gr .gap{height:26px}
.pr{margin-top:46px;line-height:2.2;font-size:14px}.pr b{font-weight:700;font-size:16px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;max-width:320px;margin:0 auto 34px;background:var(--card);padding:22px 14px;border-radius:20px;border:1px solid var(--line)}
.cal .cm{grid-column:1/-1;font-weight:700;margin-bottom:10px}
.cal span,.cal b{height:36px;display:grid;place-items:center;font-size:14px;font-weight:400;position:relative}
.cal .su{color:#d9726a}
.cal .me{color:#fff;font-weight:700}.cal .me::before{content:"♥";position:absolute;font-size:50px;line-height:1;color:var(--acc);z-index:-1;animation:hb 1.4s ease-in-out infinite}
@keyframes hb{50%{transform:scale(1.14)}}
.cd{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
.cd div{width:64px;padding:12px 0 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;line-height:1.3}
.cd strong{display:block;font:500 26px/1.1 'Cormorant Garamond',serif;color:var(--acc)}.cd small{font-size:11px;color:var(--mute)}
.tk{animation:tk .4s}@keyframes tk{from{transform:translateY(-8px);opacity:0}}
/* gallery */
.gal{padding-left:0;padding-right:0}
.gs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px calc(50% - 125px) 26px;scrollbar-width:none}
.gs::-webkit-scrollbar{display:none}
.sl{flex:0 0 250px;height:350px;border-radius:125px 125px 12px 12px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;transition:transform .12s}
.sl em{font:italic 500 44px/1 'Cormorant Garamond',serif}.sl small{font-size:12px;opacity:.85}
.dt{display:flex;justify-content:center;gap:8px}.dt i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:.35s}.dt i.on{width:22px;background:var(--acc)}
/* location */
.mp{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--card);margin-bottom:22px}
.mp svg{display:block;width:100%}.pin{animation:bn 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes bn{50%{transform:translateY(-8px)}}
.bt{font:inherit;font-size:14px;border:1px solid var(--acc);color:var(--acc);background:none;padding:10px 18px;border-radius:99px;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .2s,background .2s}
.bt:active{transform:scale(.94)}.bt.f{background:var(--acc);color:var(--bg)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.ad{line-height:1.8}.ad b{font-size:17px}.ad span{color:var(--mute);font-size:14px}
/* account */
.ac{margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left}
.ac>button{width:100%;font:inherit;font-weight:700;background:none;border:0;color:var(--ink);padding:16px 20px;display:flex;justify-content:space-between;cursor:pointer}
.ac>button span{transition:transform .4s;color:var(--acc)}.ac.o>button span{transform:rotate(180deg)}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}.ac.o .bd{grid-template-rows:1fr}.bd>div{overflow:hidden}
.ro{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line);font-size:13px;line-height:1.6}
.ro .bt{padding:5px 12px;font-size:12px}
/* guestbook */
.gb{text-align:left}.gm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px;font-size:14px;line-height:1.7;animation:ni .6s}
.gm b{display:block;font-size:13px;color:var(--acc)}@keyframes ni{from{opacity:0;transform:translateY(-12px) scale(.96)}}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:10px;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--acc)}textarea{resize:none;height:84px}
footer{padding:20px 28px 80px;text-align:center;font-size:13px;color:var(--mute)}
/* sheet */
.ov{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;background:var(--bg);border-radius:26px 26px 0 0;padding:28px 28px calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:61;text-align:center}
.sh.on{transform:translate(-50%,0)}.sh h3{margin:0 0 18px;font-size:18px}
.sg{display:flex;position:relative;background:var(--soft);border-radius:99px;padding:4px;margin-bottom:14px}
.sg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--card);border-radius:99px;transition:transform .4s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 8px #0002}.sg.n::before{transform:translateX(100%)}
.sg button{flex:1;z-index:1;border:0;background:none;font:inherit;padding:10px;color:var(--ink);cursor:pointer}
.st{display:flex;align-items:center;justify-content:center;gap:20px;margin:6px 0 18px}.st button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}.st output{min-width:60px}
#ts{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:13px;opacity:0;transition:.35s;z-index:90;pointer-events:none;white-space:nowrap}#ts.on{opacity:1;transform:translate(-50%,0)}
#pt{position:fixed;inset:0;z-index:5;pointer-events:none}
.bh{position:fixed;z-index:80;pointer-events:none;color:var(--acc);font-style:normal;animation:bh 1.3s ease-out forwards}
@keyframes bh{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="pt"></canvas>
<div class="cover" id="cover">
  <div class="cv l"></div><div class="cv r"></div>
  <button class="seal" id="seal" aria-label="청첩장 열기"><span id="ini"></span><small>탭하여 열기</small></button>
</div>

<main class="wrap">
  <section class="hero" id="hero">
    <p class="en rv" style="--d:.3s">We’re getting married</p>
    <div class="arch rv" id="arch" style="--d:.5s"><b></b>
      <svg viewBox="0 0 120 160"><circle cx="46" cy="80" r="28" pathLength="1"/><circle cx="74" cy="80" r="28" pathLength="1"/></svg>
    </div>
    <h1 class="rv" style="--d:.8s"><span id="n1"></span><i>&amp;</i><span id="n2"></span></h1>
    <p class="d rv" id="hd" style="--d:1s"></p>
    <div class="sc"></div>
  </section>

  <section class="gr">
    <h2>초대합니다</h2>
    <div id="msg"></div>
    <div class="pr rv" id="pr"></div>
  </section>

  <section>
    <h2>우리의 날</h2>
    <div class="cal rv" id="cal"></div>
    <div class="cd rv" id="cd"></div>
    <p class="rv" id="dd"></p>
  </section>

  <section class="gal">
    <h2>함께한 순간</h2>
    <div class="gs" id="gs"></div>
    <div class="dt" id="dt"></div>
  </section>

  <section>
    <h2>오시는 길</h2>
    <div class="mp rv">
      <svg viewBox="0 0 360 200" aria-hidden="true">
        <rect width="360" height="200" fill="var(--soft)"/>
        <g stroke="var(--card)" stroke-width="14" fill="none" stroke-linecap="round"><path d="M-10 150 L370 110"/><path d="M120 -10 L160 210"/><path d="M250 -10 L230 210"/></g>
        <g stroke="var(--line)" stroke-width="4" fill="none"><path d="M-10 60 L370 40"/><path d="M60 -10 L40 210"/></g>
        <rect x="262" y="128" width="46" height="32" rx="6" fill="var(--line)"/><rect x="40" y="90" width="50" height="30" rx="6" fill="var(--line)"/>
        <circle cx="185" cy="103" r="10" fill="var(--acc)" opacity=".25"><animate attributeName="r" values="8;30" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;0" dur="2s" repeatCount="indefinite"/></circle>
        <g class="pin"><path d="M185 104 c-12-14-14-22-14-27 a14 14 0 0 1 28 0 c0 5-2 13-14 27z" fill="var(--acc)"/><circle cx="185" cy="77" r="5" fill="#fff"/></g>
      </svg>
    </div>
    <div class="ad rv"><b id="vn"></b><br><span id="va"></span></div>
    <div class="row rv"><button class="bt" id="cpa">주소 복사</button><a class="bt" id="nv" target="_blank" rel="noopener">네이버지도</a><a class="bt" id="kk" target="_blank" rel="noopener">카카오맵</a></div>
  </section>

  <section>
    <h2>마음 전하실 곳</h2>
    <div id="acc"></div>
  </section>

  <section>
    <h2>참석 여부</h2>
    <p class="rv" style="margin-bottom:22px">귀한 걸음 해주시는 분들을<br>더 정성껏 맞이할 수 있도록 알려주세요.</p>
    <button class="bt f rv" id="rs">참석 의사 전달하기</button>
  </section>

  <section class="gb">
    <h2 style="text-align:center">방명록</h2>
    <input id="gn" placeholder="이름" maxlength="12" autocomplete="off">
    <textarea id="gt" placeholder="축하의 한마디를 남겨주세요" maxlength="120"></textarea>
    <button class="bt f" id="gs2" style="width:100%;margin-bottom:22px">남기기</button>
    <div id="gl"></div>
  </section>

  <footer>
    <div class="row" style="margin:0 0 36px"><button class="bt" id="sh">청첩장 공유하기</button></div>
    <p id="ft"></p>
  </footer>
</main>

<div class="ov" id="ov"></div>
<div class="sh" id="sheet" role="dialog" aria-label="참석 여부">
  <h3>참석 여부를 알려주세요</h3>
  <input id="rn" placeholder="성함" maxlength="12" autocomplete="off">
  <div class="sg" id="sg"><button data-v="y">참석할게요</button><button data-v="n">아쉽지만 불참</button></div>
  <div class="st"><button id="mi" aria-label="인원 줄이기">−</button><output id="ct">1명</output><button id="pl" aria-label="인원 늘리기">+</button></div>
  <button class="bt f" id="rsend" style="width:100%">전달하기</button>
</div>
<div id="ts" role="status"></div>

<script>
/* ===== 여기만 수정하세요 ===== */
const C={
  gi:'민준',bi:'서연',
  date:new Date(2027,3,24,14,0),
  venue:'더 그랜드 가든홀 3층 그랜드볼룸',addr:'서울특별시 강남구 테헤란로 123',
  msg:['나란히 걸어온 시간 위에','오늘, 한 걸음 더 가까이','서로의 이름을 부르며 살아가려 합니다.','','저희의 첫 약속을 맺는 자리에','귀한 걸음으로 함께해 주시면','더없는 기쁨으로 간직하겠습니다.'],
  pr:[['김철수 · 박영희','의 장남','민준'],['이정호 · 최미경','의 차녀','서연']],
  acc:{'신랑측 계좌':[['신랑 김민준','국민 123456-78-901234'],['아버지 김철수','신한 110-123-456789']],'신부측 계좌':[['신부 이서연','우리 1002-123-456789'],['어머니 최미경','하나 123-456789-01234']]},
  pal:[['#9fb1e0','#7188c8'],['#f6c9bf','#e3a2a8'],['#c9bfe0','#9d92c9'],['#b8d4d0','#7fb0ab'],['#f0dcc2','#d9b98a'],['#c7d0e8','#8e9fcf']]
};
/* ============================ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],D=C.date,p2=n=>String(n).padStart(2,'0');
const WK=['일','월','화','수','목','금','토'];
$('#ini').textContent=C.gi[0]+'&'+C.bi[0];$('#n1').textContent=C.gi;$('#n2').textContent=C.bi;
const hh=D.getHours(),tm=(hh<12?'오전 ':'오후 ')+(hh%12||12)+'시'+(D.getMinutes()?' '+D.getMinutes()+'분':'');
$('#hd').innerHTML=`${D.getFullYear()}. ${p2(D.getMonth()+1)}. ${p2(D.getDate())}<br>${WK[D.getDay()]}요일 ${tm}<br>${C.venue.split(' ')[0]} ${C.venue.split(' ').slice(1,2)}`;
$('#msg').innerHTML=C.msg.map((t,i)=>t?`<p class="rv" style="--d:${(i%4)*.12}s">${t}</p>`:'<div class="gap"></div>').join('');
$('#pr').innerHTML=C.pr.map(([a,b,c])=>`<p>${a} ${b} <b>${c}</b></p>`).join('');
$('#vn').textContent=C.venue;$('#va').textContent=C.addr;
$('#nv').href='https://map.naver.com/p/search/'+encodeURIComponent(C.addr);$('#kk').href='https://map.kakao.com/?q='+encodeURIComponent(C.addr);
$('#ft').innerHTML=`${C.gi} ♥ ${C.bi}<br>함께해 주셔서 감사합니다`;
/* calendar */
{const y=D.getFullYear(),m=D.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
let h=`<div class="cm">${y}년 ${m+1}월</div>`+WK.map((d,i)=>`<b class="${i?'':'su'}">${d}</b>`).join('')+'<span></span>'.repeat(f);
for(let i=1;i<=n;i++)h+=`<span class="${i==D.getDate()?'me':(f+i-1)%7?'':'su'}">${i}</span>`;$('#cal').innerHTML=h}
/* countdown */
$('#cd').innerHTML=['일','시간','분','초'].map(u=>`<div><strong>0</strong><small>${u}</small></div>`).join('');
let ps=-1;function cd(){let d=D-Date.now();const past=d<0;d=Math.abs(d);const v=[d/864e5,d/36e5%24,d/6e4%60,d/1e3%60].map(Math.floor);
$$('#cd strong').forEach((e,i)=>{const t=i==3?p2(v[i]):String(v[i]);if(e.textContent!==t){e.textContent=t;e.classList.remove('tk');void e.offsetWidth;e.classList.add('tk')}});
$('#dd').innerHTML=past?`${C.gi} ♥ ${C.bi}, 이제 부부로 살아갑니다`:`${C.gi} ♥ ${C.bi}의 결혼식이<br><b>${v[0]+1}일</b> 남았습니다`}
cd();setInterval(cd,1000);
/* gallery */
$('#gs').innerHTML=C.pal.map(([a,b],i)=>`<div class="sl" style="background:linear-gradient(165deg,${a},${b})"><em>${i+1}</em><small>사진을 넣어주세요</small></div>`).join('');
$('#dt').innerHTML=C.pal.map(()=>'<i></i>').join('');
const gs=$('#gs');function gp(){const r=gs.getBoundingClientRect(),c=r.left+r.width/2;let bi=0,bd=1e9;$$('.sl').forEach((s,i)=>{const b=s.getBoundingClientRect(),d=Math.abs(b.left+b.width/2-c);s.style.transform=`scale(${1-Math.min(d/r.width,.5)*.2})`;s.style.opacity=1-Math.min(d/r.width,.6)*.55;if(d<bd){bd=d;bi=i}});$$('#dt i').forEach((e,i)=>e.classList.toggle('on',i==bi))}
gs.addEventListener('scroll',gp,{passive:true});gp();
/* accounts */
$('#acc').innerHTML=Object.entries(C.acc).map(([k,v])=>`<div class="ac"><button>${k}<span>⌄</span></button><div class="bd"><div>${v.map(([n,a])=>`<div class="ro"><div>${n}<br>${a}</div><button class="bt" data-c="${a}">복사</button></div>`).join('')}</div></div></div>`).join('');
$$('.ac>button').forEach(b=>b.onclick=()=>b.parentNode.classList.toggle('o'));
/* helpers */
let tt;function toast(s){const e=$('#ts');e.textContent=s;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1900)}
async function cp(t,m){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast(m||'복사되었어요')}
$$('[data-c]').forEach(b=>b.onclick=()=>cp(b.dataset.c,'계좌번호가 복사되었어요'));
$('#cpa').onclick=()=>cp(C.addr,'주소가 복사되었어요');
$('#sh').onclick=async()=>{const u={title:document.title,url:location.href};try{if(navigator.share){await navigator.share(u);return}}catch(e){return}cp(location.href,'링크가 복사되었어요')};
function burst(px,py,n=18){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<n;i++){const e=document.createElement('i');e.className='bh';e.textContent=['♥','✦','❀'][i%3];const a=Math.random()*6.28,d=60+Math.random()*110;e.style.cssText=`left:${px}px;top:${py}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-60}px;font-size:${12+Math.random()*14}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
$('#hero').addEventListener('click',e=>burst(e.clientX,e.clientY,10));
/* petals */
const cv=$('#pt'),x=cv.getContext('2d');let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};addEventListener('resize',rs);rs();
const mk=f=>({x:Math.random()*W,y:f?Math.random()*H:-20,s:4+Math.random()*5,v:.35+Math.random()*.8,w:Math.random()*6,r:Math.random()*6,a:.35+Math.random()*.4});
const P=Array.from({length:22},()=>mk(1));
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)(function t(){x.clearRect(0,0,W,H);for(const p of P){p.y+=p.v;p.w+=.02;p.x+=Math.sin(p.w)*.7;p.r+=.025;if(p.y>H+20)Object.assign(p,mk(0));x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=p.a;x.fillStyle='#f2a9b4';x.beginPath();x.ellipse(0,0,p.s,p.s*.55,0,0,6.3);x.fill();x.restore()}requestAnimationFrame(t)})();
/* reveal + parallax */
function io(){const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');o.unobserve(e.target)}}),{threshold:.15});$$('.rv').forEach(e=>o.observe(e))}
let pq=0;addEventListener('scroll',()=>{if(pq)return;pq=requestAnimationFrame(()=>{pq=0;document.documentElement.style.setProperty('--py',Math.min(scrollY*.12,60)+'px')})},{passive:true});
/* cover */
$('#seal').onclick=()=>{$('#cover').classList.add('open');burst(innerWidth/2,innerHeight/2,22);setTimeout(io,500)};
/* rsvp */
let att='y',cnt=1;const sheet=$('#sheet'),ov=$('#ov'),sg=$('#sg');
const so=on=>{sheet.classList.toggle('on',on);ov.classList.toggle('on',on)};
$('#rs').onclick=()=>so(1);ov.onclick=()=>so(0);
$$('#sg button').forEach(b=>b.onclick=()=>{att=b.dataset.v;sg.classList.toggle('n',att=='n')});
const sc=()=>$('#ct').textContent=cnt+'명';
$('#mi').onclick=()=>{cnt=Math.max(1,cnt-1);sc()};$('#pl').onclick=()=>{cnt=Math.min(10,cnt+1);sc()};
$('#rsend').onclick=e=>{const n=$('#rn').value.trim();if(!n){toast('성함을 입력해 주세요');$('#rn').focus();return}so(0);
if(att=='y'){burst(innerWidth/2,innerHeight*.6,30);toast(`${n}님 외 ${cnt}명, 참석 의사가 전달되었어요 ♥`)}else toast('전달되었어요. 마음 감사히 받을게요');$('#rn').value=''};
/* guestbook */
const gl=$('#gl'),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const add=(n,t)=>gl.insertAdjacentHTML('afterbegin',`<div class="gm"><b>${esc(n)}</b>${esc(t)}</div>`);
add('하윤','두 분 오래오래 행복하세요! 결혼 진심으로 축하해요 🎉');add('지훈','드디어! 식장에서 만나요 ♥');
$('#gs2').onclick=()=>{const n=$('#gn').value.trim(),t=$('#gt').value.trim();if(!n||!t){toast('이름과 메시지를 모두 입력해 주세요');return}add(n,t);$('#gn').value=$('#gt').value='';toast('방명록에 남겼어요')};
</script>
</body>
</html>
